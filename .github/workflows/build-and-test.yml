name: xnuimagefuzzer-build-and-test

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  workflow_dispatch:

jobs:
  qa-corpus:
    name: Deterministic image and ICC QA
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Unit tests
        run: |
          set -euo pipefail
          python3 -m unittest contrib/scripts/test_icc_container.py

      - name: Generate and validate twice
        run: |
          set -euo pipefail
          .github/scripts/generate-qa-images.sh /tmp/qa-one both both --seed 1
          .github/scripts/generate-qa-images.sh /tmp/qa-two both both --seed 1
          python3 contrib/scripts/validate_qa_corpus.py /tmp/qa-one
          python3 contrib/scripts/validate_qa_corpus.py /tmp/qa-two
          diff -u /tmp/qa-one/manifest.json /tmp/qa-two/manifest.json
          find /tmp/qa-one -type f ! -name manifest.json -print0 | sort -z | \
            xargs -0 shasum -a 256 | sed 's#/tmp/qa-one/##' > /tmp/qa-one.sha256
          find /tmp/qa-two -type f ! -name manifest.json -print0 | sort -z | \
            xargs -0 shasum -a 256 | sed 's#/tmp/qa-two/##' > /tmp/qa-two.sha256
          diff -u /tmp/qa-one.sha256 /tmp/qa-two.sha256

      - name: Capture macOS malformed ICC outcomes
        run: |
          set -euo pipefail
          .github/scripts/generate-qa-images.sh /tmp/qa-roundtrip both clean \
            --include-mutated --apple-roundtrip --seed 7
          python3 contrib/scripts/validate_qa_corpus.py /tmp/qa-roundtrip

      - name: Upload verified corpus
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-image-icc-qa
          path: /tmp/qa-one/
          retention-days: 14
          if-no-files-found: error

      - name: Upload macOS ICC outcome evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-malformed-icc-outcomes
          path: /tmp/qa-roundtrip/
          retention-days: 14
          if-no-files-found: error
