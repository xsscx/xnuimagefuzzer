name: xnuimagefuzzer-instrumented

permissions:
  contents: read

concurrency:
  group: instrumented-${{ github.ref }}
  cancel-in-progress: true

env:
  BASH_ENV: /dev/null

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.py'
      - '.github/scripts/**'
      - '.github/workflows/instrumented.yml'
  pull_request:
    branches: [main, master]
    paths:
      - '**/*.m'
      - '**/*.h'
      - '**/*.py'
      - '.github/scripts/**'
      - '.github/workflows/instrumented.yml'
  workflow_dispatch:

jobs:
  native-sanitizers-and-coverage:
    name: Native ASAN, UBSAN, and coverage
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and run instrumented QA
        run: |
          set -euo pipefail
          python3 -m unittest contrib/scripts/test_icc_container.py
          .github/scripts/build-native.sh

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-coverage
          path: /tmp/coverage-report/
          retention-days: 14
          if-no-files-found: error

      - name: Upload verified QA corpus
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-verified-image-icc-qa
          path: /tmp/fuzzed-output/corpus/
          retention-days: 14
          if-no-files-found: error
