###############################################################
#
# Intent: xnuimagefuzzer-release
#
# Create a GitHub Release with build artifacts when a version
# tag is pushed (v*). Also supports manual dispatch.
#
# Artifacts included:
#   - iOS Simulator app bundle (.app, zipped)
#   - Verified image and ICC QA corpus
#   - Build metadata (Xcode version, checksums)
#
# Security hardening:
#   - Pinned action SHAs
#   - Least-privilege permissions
#   - persist-credentials: false
#   - BASH_ENV=/dev/null
#   - No user-controllable inputs in run: blocks
#
###############################################################

name: xnuimagefuzzer-release

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  BASH_ENV: /dev/null
  SCHEME: "XNU Image Fuzzer"
  PROJECT: "XNU Image Fuzzer.xcodeproj"
  DESTINATION: "generic/platform=iOS Simulator"

defaults:
  run:
    shell: bash --noprofile --norc {0}

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0). Leave empty to use latest commit.'
        required: false
        type: string

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: macos-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      app_path: ${{ steps.verify.outputs.app_path }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Determine version
        id: version
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            VERSION="$INPUT_TAG"
          else
            VERSION="dev-$(git rev-parse --short HEAD)"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building release: ${VERSION}"

      - name: Show Xcode version
        id: xcode
        run: |
          set -euo pipefail
          XCODE_VERSION=$(xcodebuild -version 2>&1 | sed -n '1p')
          echo "xcode_version=${XCODE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "${XCODE_VERSION}"
          xcrun simctl list runtimes 2>&1 | sed -n '1,5p'

      - name: Build for iOS Simulator (Release)
        run: |
          set -euo pipefail
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            2>&1 | tee /tmp/xcodebuild-release.log
          echo "Release build succeeded"

      - name: Verify build artifacts
        id: verify
        run: |
          set -euo pipefail
          BUILD_DIR=$(xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            -showBuildSettings \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            2>/dev/null | grep -m1 'BUILT_PRODUCTS_DIR' | awk '{print $3}')

          APP_PATH="$BUILD_DIR/XNU Image Fuzzer.app"
          if [ -d "$APP_PATH" ]; then
            echo "App bundle: $APP_PATH"
            file "$APP_PATH/XNU Image Fuzzer"
            echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          else
            echo "ERROR: App bundle not found"
            exit 1
          fi

      - name: Package app bundle
        run: |
          set -euo pipefail
          APP_PATH="${{ steps.verify.outputs.app_path }}"
          cd "$(dirname "$APP_PATH")"
          zip -r /tmp/XNUImageFuzzer-Simulator.zip "XNU Image Fuzzer.app"
          echo "App bundle packaged"
          ls -lh /tmp/XNUImageFuzzer-Simulator.zip

      - name: Run static analysis
        run: |
          set -euo pipefail
          xcodebuild analyze \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -destination "$DESTINATION" \
            -configuration Release \
            -derivedDataPath /tmp/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            RUN_CLANG_STATIC_ANALYZER=YES \
            2>&1 | tee /tmp/xcodebuild-release-analyze.log | tail -10
          echo "Static analysis passed"

      - name: Generate build metadata
        run: |
          set -euo pipefail
          cat > /tmp/build-metadata.txt <<EOF
          XNU Image Fuzzer - Build Metadata
          ==================================
          Version:    ${{ steps.version.outputs.version }}
          Commit:     ${{ github.sha }}
          Date:       $(date -u '+%Y-%m-%d %H:%M:%S UTC')
          Runner:     $(uname -m) / $(sw_vers -productVersion)
          Xcode:      ${{ steps.xcode.outputs.xcode_version }}
          Build:      Release (iOS Simulator, universal arch)

          SHA-256 Checksums:
          $(shasum -a 256 /tmp/XNUImageFuzzer-Simulator.zip)
          EOF
          cat /tmp/build-metadata.txt

      - name: Upload app bundle artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: XNUImageFuzzer-Simulator-${{ steps.version.outputs.version }}
          path: /tmp/XNUImageFuzzer-Simulator.zip
          retention-days: 90
          if-no-files-found: error

      - name: Upload build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-metadata-${{ steps.version.outputs.version }}
          path: /tmp/build-metadata.txt
          retention-days: 90

  generate-corpus:
    name: Generate Verified Image and ICC QA Corpus
    runs-on: macos-latest
    needs: build-release
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Credential hardening
        run: |
          set -euo pipefail
          git config --global credential.helper ""
          unset GITHUB_TOKEN || true

      - name: Generate and validate deterministic corpus
        run: |
          set -euo pipefail
          .github/scripts/generate-qa-images.sh \
            /tmp/verified-image-icc-qa both both --seed 1

      - name: Package corpus
        run: |
          set -euo pipefail
          cd /tmp
          tar czf verified-image-icc-qa.tar.gz -C verified-image-icc-qa .
          ls -lh verified-image-icc-qa.tar.gz

      - name: Upload corpus artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-image-icc-qa-${{ needs.build-release.outputs.version }}
          path: /tmp/verified-image-icc-qa.tar.gz
          retention-days: 90
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-release, generate-corpus]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/release-artifacts

      - name: Generate release notes
        id: notes
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-release.outputs.version }}"
          PREV_TAG=$(git tag --sort=-creatordate | grep '^v' | sed -n '1,2p' | tail -1) || true

          printf '## XNU Image Fuzzer %s\n\n' "$VERSION" > /tmp/release-notes.md
          cat >> /tmp/release-notes.md <<'NOTES_EOF'
          Deterministic image and ICC quality-assurance tooling for Apple image parsers.

          ### Release Artifacts

          | Artifact | Description |
          |----------|-------------|
          | `XNUImageFuzzer-Simulator.zip` | iOS Simulator app bundle (Release build) |
          | `verified-image-icc-qa.tar.gz` | Validated clean/fuzzed images with exact ICC/no-ICC pairs and manifest |
          | `build-metadata.txt` | Build environment details and checksums |

          ### Usage

          **iOS Simulator:**
          ```bash
          unzip XNUImageFuzzer-Simulator.zip
          xcrun simctl install booted "XNU Image Fuzzer.app"
          ```

          **Verified Image and ICC QA Corpus:**
          ```bash
          tar xzf verified-image-icc-qa.tar.gz -C ./test-images/
          python3 contrib/scripts/validate_qa_corpus.py ./test-images/
          ```

          ### Security

          - Built with `GCC_TREAT_WARNINGS_AS_ERRORS=YES`
          - Clang static analysis passed
          - All checksums in `build-metadata.txt`
          NOTES_EOF

          if [ -n "$PREV_TAG" ] && [ "$PREV_TAG" != "$VERSION" ]; then
            {
              echo ""
              echo "### Changes since ${PREV_TAG}"
              echo ""
              git log "${PREV_TAG}..HEAD" --oneline --no-merges | sed -n '1,30p'
            } >> /tmp/release-notes.md
          fi

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p /tmp/assets
          # Flatten downloaded artifacts into assets dir
          find /tmp/release-artifacts -type f | while read -r f; do
            cp "$f" /tmp/assets/
          done
          echo "Release assets:"
          ls -lh /tmp/assets/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.build-release.outputs.version }}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} exists - uploading assets"
            gh release upload "${VERSION}" /tmp/assets/* --clobber
          else
            gh release create "${VERSION}" \
              --title "XNU Image Fuzzer ${VERSION}" \
              --notes-file /tmp/release-notes.md \
              --verify-tag \
              /tmp/assets/*
          fi

          echo "Release ready: ${VERSION}"
